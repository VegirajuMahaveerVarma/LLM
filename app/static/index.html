<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENGI-MIND</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef2ff}main{max-width:900px;margin:auto;padding:48px 20px}h1{font-size:44px;margin:0 0 8px}.sub{color:#aab4d0}textarea,select,input,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #303957;background:#121a30;color:inherit}button{cursor:pointer;background:#eef2ff;color:#0b1020;font-weight:700}.card{background:#11182b;border:1px solid #29324d;border-radius:16px;padding:20px;margin-top:20px;white-space:pre-wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>ENGI-MIND</h1><div class="sub">Engineering Student AI — learn, practice, build, and prepare.</div><div class="grid"><select id="mode"><option>learn</option><option>exam</option><option>practice</option><option>project</option><option>career</option></select><input id="branch" value="CSE" placeholder="Branch"></div><textarea id="q" rows="6" placeholder="Ask an engineering question..."></textarea><button onclick="ask()">Ask ENGI-MIND</button><div id="out" class="card">Ready.</div><script>async function ask(){const o=document.getElementById('out');o.textContent='Thinking...';try{const r=await fetch('/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q.value,mode:mode.value,student:{branch:branch.value}})});const d=await r.json();o.textContent=d.answer+'\n\nNext steps:\n• '+d.next_steps.join('\n• ')}catch(e){o.textContent='Request failed: '+e}}</script></main></body></html>
